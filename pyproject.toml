[project]
name = "byotod"
version = "0.1.0"
description = "Builds the transit taxlot datasets in data/"
requires-python = ">=3.10"
dependencies = [
    # 1.0+ reads files through pyogrio (pulled in as a dependency) and has
    # GeoSeries.hilbert_distance and dissolve(dropna=...).
    "geopandas>=1.0",
    # 2.0+ for shapely.set_precision on arrays.
    "shapely>=2.0",
    # Parquet writer behind GeoDataFrame.to_parquet.
    "pyarrow>=14",
    # HTTP client for download_data.py.
    "requests",
]

[tool.uv]
# The Python here is a script, not an installable package.
package = false
